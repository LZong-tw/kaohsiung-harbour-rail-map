<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>高雄臨港線 1900–2024</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE 研究底圖：安靜、精確，線路是主角
   IDEA 鐵道略圖畫在今日街圖上；選一個年份，看哪些線在跑、哪些已停
   PICTURE 大地圖，線名沿線標註；旁邊是該年的路線清單，清單本身就是圖例
   COLOUR 灰階底圖；縱貫藍 #1d4e89、臨港線紫 #7b2d8e、第二臨港線朱 #c1121f、支線橙 #c2620a、輕軌綠 #2f9e44、停用灰虛線
   TYPE Noto Sans TC 900 年份、700 線名、400 說明
   LAYOUT 桌機：地圖左、清單右；手機：地圖在上、清單在下 */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0e1418);--ink:light-dark(#14181d,#e7ecef);--mute:light-dark(#5b6670,#9aa7b1);--soft:light-dark(#f3f4f2,#162027);--line:light-dark(#dfe3e6,#26323a);--acc:#7b2d8e}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Noto Sans TC",system-ui,sans-serif}
.app{display:grid;grid-template-columns:minmax(0,1fr) 360px;height:100%}
.mapbox{position:relative}
#map{position:absolute;inset:0;background:#d9dcd8}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .leaflet-image-layer{filter:invert(.92) hue-rotate(180deg) brightness(.85)}}
:root[data-theme=dark] .leaflet-image-layer{filter:invert(.92) hue-rotate(180deg) brightness(.85)}
.hd{position:absolute;z-index:500;top:12px;left:16px;pointer-events:none;color:#14181d;text-shadow:0 0 3px #fff,0 0 8px #fff,0 0 14px #fff}
.hd h1{margin:0;font-size:clamp(18px,2.4vw,24px);font-weight:700;line-height:1.2}
.hd output{display:block;font-size:clamp(48px,8vw,80px);font-weight:900;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.side{overflow:auto;border-left:1px solid var(--line);padding:16px 18px 24px}
.side input[type=range]{width:100%;height:40px;margin:0;accent-color:var(--acc)}
.ticks{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.ticks button{min-height:32px;padding:0 9px;border-radius:16px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:13px;font-variant-numeric:tabular-nums;cursor:pointer}
.ticks button:hover{border-color:var(--ink)}
.ticks button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ev{margin:0 0 16px;padding:10px 12px;border-left:4px solid var(--acc);background:var(--soft);border-radius:0 6px 6px 0}
.ev time{display:block;font-weight:700;font-variant-numeric:tabular-nums}
.side h2{font-size:15px;margin:14px 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.side h2 span{font-variant-numeric:tabular-nums;color:var(--mute);font-weight:500}
.ls{list-style:none;margin:0;padding:0}
.ls li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:0 10px;padding:6px 6px;border-radius:6px;cursor:pointer}
.ls li:hover,.ls li:focus-visible{background:var(--soft)}
.ls svg{margin-top:5px}
.ls b{font-weight:700}
.ls .y{color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap;margin-left:6px;font-size:13px}
.ls p{grid-column:2;margin:1px 0 0;color:var(--mute);font-size:13px}
.ls.off b{font-weight:500;color:var(--mute)}
.key{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 14px;margin:12px 0 0;font-size:13px;color:var(--mute)}
.key div{display:flex;align-items:center;gap:8px;min-height:22px}.key svg{flex:none}
.tog{display:flex;align-items:center;gap:8px;font-size:14px;min-height:40px;cursor:pointer;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.tog input{width:18px;height:18px;margin:0;accent-color:var(--acc)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.lbl{background:rgba(255,255,255,.92);border:0;box-shadow:none;padding:calc(1px*var(--s,1)) calc(5px*var(--s,1));font:700 calc(13px*var(--s,1))/1.3 "Noto Sans TC",sans-serif;color:#14181d;border-radius:3px}
.lbl::before{display:none}
.lbl.off{color:#8a949c;font-weight:500}
.leaflet-tooltip.pick{font:13px/1.5 "Noto Sans TC",sans-serif;padding:5px 9px;white-space:nowrap}.pick span{margin-left:.6em;color:#5b6670}.pick .off{color:#8a949c}
.ll{font-family:"Noto Sans TC",sans-serif;font-weight:700;paint-order:stroke;stroke:#fff;stroke-linejoin:round;pointer-events:none;letter-spacing:.06em}
.leaflet-container{font-family:"Noto Sans TC",sans-serif}
@media(max-width:760px){html,body{height:auto}.app{grid-template-columns:minmax(0,1fr);grid-template-rows:62svh auto;height:auto}.side{border-left:0;border-top:1px solid var(--line);overflow:visible}}
</style>

</head>

 o.on=true;const sz=o.size*scale();const need=sz*(o.text.length+1.5)*1.05;
 const w=window_(o,need);
 if(!w){if(o.el)o.el.style.display='none';return}
 o.h.setLatLngs(w);if(!m.hasLayer(o.h))o.h.addTo(m);
 const p=o.h._path;p.id='lp-'+key;
 if(!o.el){const NS='http://www.w3.org/2000/svg';o.el=document.createElementNS(NS,'text');o.el.setAttribute('class','ll');
  const tp=document.createElementNS(NS,'textPath');tp.setAttribute('href','#lp-'+key);tp.setAttribute('startOffset','50%');tp.setAttribute('text-anchor','middle');tp.textContent=o.text;o.el.appendChild(tp);o.el.setAttribute('dy','-0.5em')}
 if(o.el.parentNode!==p.parentNode)p.parentNode.appendChild(o.el);
 o.el.setAttribute('font-size',sz.toFixed(1));o.el.setAttribute('fill',o.color);o.el.setAttribute('stroke-width',(sz*.28).toFixed(1));
 o.el.style.display=o.h._parts&&o.h._parts.length?'':'none';
}
function relabel(){mapEl.style.setProperty('--s',scale().toFixed(3));for(const k in LBL)if(LBL[k].on)showLabel(k,true);
 const keys=Object.keys(LBL).sort((a,b)=>(a.startsWith('x-')?1:0)-(b.startsWith('x-')?1:0)),R=[];
 for(const k of keys){const o=LBL[k];if(!o.on||!o.el||o.el.style.display==='none')continue;const b0=o.el.getBoundingClientRect(),sx=b0.width*.3,sy=b0.height*.3,r={left:b0.left+sx,right:b0.right-sx,top:b0.top+sy,bottom:b0.bottom-sy};
  if(R.some(q=>!(r.right<q.left||r.left>q.right||r.bottom<q.top||r.top>q.bottom))){o.el.style.display='none';continue}R.push(r)}}

m.attributionControl.setPrefix(false).addAttribution('© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors');
const FB=[[22.556,120.268],[22.672,120.362]];m.fitBounds(FB);addEventListener('load',()=>{m.invalidateSize();m.fitBounds(FB)});
const yard=G.yard.map(g=>{const l=L.polyline(g,{color:'#7b2d8e',weight:1.5,opacity:.6,interactive:false});
 // 股道依最近的車站決定年份
 let best=null,bd=1e9;for(const[n,o,c]of STN){const p=G.st[n];if(!p)continue;const d=Math.hypot(p[0]-g[0][0],(p[1]-g[0][1])*.92);if(d<bd){bd=d;best=[o,c]}}
 l._o=best?best[0]:0;l._c=best?best[1]:9999;return l});
const lay={};
for(const s of SEG){lay[s.id]=L.polyline(G.seg[s.id],{...STY[s.k],lineCap:'round',lineJoin:'round',interactive:false})}
for(const s of SEG)if(s.lb)mkLabel(s.id,G.seg[s.id],s.lb,STY[s.k].color,13);
const order=['zg_n','zg_s','pt','west','hm','l1w','ob','w0','w1','qzb','w2','w3','k4','e1','zd','s2','s2b','c2','c3','qy1','qy2','lr1','lr2'];
const stl={};
for(const[n,o,c,dir]of STN){const p=G.st[n];stl[n]={o,c,mk:L.circleMarker(p,{radius:5,color:'#3b4248',weight:2,fillColor:'#fff',fillOpacity:1}),dir}}
const sl=document.getElementById('sl'),yr=document.getElementById('yr');
var draw=function(y){
 yr.textContent=y;sl.value=y;
 for(const id of order){const s=SEG.find(x=>x.id===id),l=lay[id];
  if(y<s.o){l.remove();showLabel(id,false);continue}
  if(y>=s.c){if(s.lr){l.remove();showLabel(id,false);continue}l.setStyle({...GH});l.addTo(m);l.bringToBack();showLabel(id,false);continue}
  l.setStyle({opacity:1,...STY[s.k],dashArray:STY[s.k].dashArray||null});l.addTo(m);if(s.lr)l.bringToFront();showLabel(id,true)}
 yard.forEach(g=>y>=g._o&&y<g._c?g.addTo(m):g.remove());
 for(const[n,v]of Object.entries(stl)){
  if(y<v.o){v.mk.remove();continue}
  const on=y<v.c;v.mk.setStyle({color:on?'#3b4248':'#8a949c',fillColor:on?'#fff':'#c9ced2'});
  v.mk.unbindTooltip().bindTooltip(n,{permanent:true,direction:v.dir,className:'lbl'+(on?'':' off'),offset:v.dir==='right'?[6,0]:v.dir==='left'?[-6,0]:[0,0]}).addTo(m)}
 const last=[...EV].reverse().find(e=>e[0]<=y);
 document.getElementById('ev').innerHTML=last?`<time>${last[1]}</time>${last[2]}`:'臨港線尚未出現';
 const yrs=s=>s.k==='unc'?'約 1977–2011':s.o+'–'+(s.c>3000?'':s.c);
 const item=(s,st)=>`<li tabindex="0" data-id="${s.id}">${sw(st)}<div><b>${s.name}</b><span class="y">${yrs(s)}</span></div><p>${s.t}</p></li>`;
 const seen=new Set(),uniq=a=>a.filter(s=>{const k=s.name;if(seen.has(k))return false;seen.add(k);return true});
 const A=uniq(SEG.filter(s=>y>=s.o&&y<s.c)),C=uniq(SEG.filter(s=>!s.lr&&y>=s.c));
 document.getElementById('la').innerHTML=A.map(s=>item(s,STY[s.k])).join('');
 document.getElementById('lc').innerHTML=C.map(s=>item(s,GH)).join('')||'<li style="cursor:default"><span></span><div>無</div></li>';
 document.getElementById('na').textContent=A.length;document.getElementById('nc').textContent=C.length;
 document.querySelectorAll('#tk button').forEach(b=>b.classList.toggle('on',+b.dataset.y===y));
}
document.getElementById('tk').innerHTML=[1900,1907,1941,1955,1967,1977,1988,2008,2011,2018,2024].map(v=>`<button type="button" data-y="${v}">${v}</button>`).join('');
sl.addEventListener('input',()=>draw(+sl.value));
document.getElementById('tk').addEventListener('click',e=>{const b=e.target.closest('button');if(b)draw(+b.dataset.y)});
for(const id of ['la','lc'])document.getElementById(id).addEventListener('click',e=>{const li=e.target.closest('li[data-id]');if(li)m.fitBounds(lay[li.dataset.id].getBounds(),{padding:[40,40],maxZoom:16})});
const EXC={'糖鐵牛寮三角線（往籬仔內）':'#7a5c3a','糖鐵籬仔內線（籬仔內站—前鎮河—小港糖廠）':'#7a5c3a','糖鐵籬子內線後期段（沿中山四路接臺糖倉庫）':'#7a5c3a','糖鐵五甲鳳山線（鳳山—五甲—籬仔內線分岐）':'#7a5c3a'};
const exL=[];
const MAINX=new Set(['獅子公園三角線東側（原主線弧線）']);
for(const[n,parts]of Object.entries(G.extra)){const mx=MAINX.has(n),col=mx?'#7b2d8e':(EXC[n]||'#c2620a');
 for(const g of parts){const st=mx?{color:col,weight:4,lineCap:'round',opacity:.95,dashArray:null,interactive:false}:{color:col,weight:3,dashArray:'6 4',lineCap:'round',opacity:.95,interactive:false};const pl=L.polyline(g,st);pl._xn=n;pl._st=st;exL.push(pl)}
 const longest=parts.reduce((a,b)=>b.length>a.length?b:a);mkLabel('x-'+n,longest,n,col,11,n==='糖鐵籬子內線'?.12:.3)}
const BRSEG={'5.4K':'zd','6.8K':'s2','前鎮橋':'qzb'};
const bpL=Object.entries(G.br).map(([n,p])=>{const c=L.circleMarker(p,{radius:3,color:'#5b6670',weight:2,fillColor:'#fff',fillOpacity:1}).bindTooltip(n,{direction:'bottom',offset:[0,4]});c._seg=Object.entries(BRSEG).find(([k])=>n.startsWith(k))?.[1];return c});
const exBox=document.getElementById('ex');
let curY=1977;const XY=G.xy||{};
const opened=n=>{const r=XY[n];return !r||r[0]==null||curY>=r[0]},closed=n=>{const r=XY[n];return !!r&&r[1]!=null&&curY>=r[1]};
const inY=n=>opened(n)&&!closed(n);
function drawExtra(){const on=exBox.checked;
 exL.forEach(l=>{const n=l._xn;
  if(MAINX.has(n)){if(!opened(n)){l.remove();return}l.setStyle(closed(n)?{...GH}:l._st);l.addTo(m);if(closed(n))l.bringToBack();return}
  on&&inY(n)?l.addTo(m):l.remove()});
 for(const n in G.extra)showLabel('x-'+n,(on||MAINX.has(n))&&inY(n))}
exBox.addEventListener('change',drawExtra);
// 路線查詢：不靠各線自己的滑鼠事件（重疊的路廊只有最上層那條點得到、虛線的空隙點不到），
// 改成在游標附近找所有看得到的線，列在同一個提示框裡。
const tip=L.tooltip({direction:'top',offset:[0,-8],className:'pick'});
const segYrs=s=>s.k==='unc'?'約 1977–2011':s.o+'–'+(s.c>3000?'':s.c);
const xyYrs=n=>{const r=XY[n];return r?(r[0]??'')+'–'+(r[1]??''):''};const xOff=n=>closed(n);
function pickAt(pt,tol){const hits=[];
 const near=l=>{if(!m.hasLayer(l)||!l._parts||!l._pxBounds)return Infinity;const b=l._pxBounds;
  if(pt.x<b.min.x-tol||pt.x>b.max.x+tol||pt.y<b.min.y-tol||pt.y>b.max.y+tol)return Infinity;
  let d=Infinity;for(const part of l._parts)for(let i=1;i<part.length&&d>.5;i++)d=Math.min(d,L.LineUtil.pointToSegmentDistance(pt,part[i-1],part[i]));return d};
 for(const s of SEG){const d=near(lay[s.id]);if(d<=tol)hits.push({d,t:s.name,y:segYrs(s),off:curY>=s.c})}
 for(const l of exL){const d=near(l);if(d<=tol)hits.push({d,t:l._xn,y:xyYrs(l._xn),off:xOff(l._xn)})}
 const seen=new Set();return hits.sort((a,b)=>(a.off-b.off)||(a.d-b.d)).filter(h=>!seen.has(h.t)&&seen.add(h.t)).slice(0,5)}
function showPick(e,tol){const h=pickAt(e.layerPoint,tol);m.getContainer().style.cursor=h.length?'pointer':'';
 if(!h.length){m.closeTooltip(tip);return}
 tip.setLatLng(e.latlng).setContent(h.map(x=>`<div${x.off?' class="off"':''}>${x.t}${x.y?`<span>${x.y}</span>`:''}</div>`).join(''));
 if(!m.hasLayer(tip))m.openTooltip(tip)}
m.on('mousemove',e=>{if(!e.originalEvent.buttons)showPick(e,8)});
m.on('click',e=>showPick(e,L.Browser.touch?18:8));
m.on('mouseout movestart zoomstart',()=>{m.closeTooltip(tip);m.getContainer().style.cursor=''});

const _draw=draw;draw=function(y){curY=y;_draw(y);bpL.forEach(b=>{const s=SEG.find(x=>x.id===b._seg);s&&y>=s.o&&y<s.c?b.addTo(m):b.remove()});drawExtra();relabel()};
m.on('zoomend moveend',relabel);
addEventListener('load',()=>{Z0=m.getZoom();relabel()});
Z0=m.getZoom();

draw(1977);
}
