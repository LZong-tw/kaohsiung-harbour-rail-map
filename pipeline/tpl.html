:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0e1418);--ink:light-dark(#14181d,#e7ecef);--mute:light-dark(#5b6670,#9aa7b1);--soft:light-dark(#f3f4f2,#162027);--line:light-dark(#dfe3e6,#26323a);--acc:#7b2d8e}

*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Noto Sans TC",system-ui,sans-serif}
.app{display:grid;grid-template-columns:minmax(0,1fr) 360px;height:100%}
.mapbox{position:relative}

.side h2 span{font-variant-numeric:tabular-nums;color:var(--mute);font-weight:500}
.ls{list-style:none;margin:0;padding:0}
.ls button{display:grid;grid-template-columns:34px minmax(0,1fr);gap:0 10px;padding:6px;width:100%;border:0;border-radius:6px;background:transparent;color:inherit;font:inherit;text-align:start;cursor:pointer}
.ls button:hover,.ls button:focus-visible{background:var(--soft)}

.ls .description{grid-column:2;margin:1px 0 0;color:var(--mute);font-size:13px}
.ls.off b{font-weight:500;color:var(--mute)}
.key{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 14px;margin:12px 0 0;font-size:13px;color:var(--mute)}
.key div{display:flex;align-items:center;gap:8px;min-height:22px}.key svg{flex:none}
.tog{display:flex;align-items:center;gap:8px;font-size:14px;min-height:40px;cursor:pointer;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.tog input{width:18px;height:18px;margin:0;accent-color:var(--acc)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.lbl{background:rgba(255,255,255,.92);border:0;box-shadow:none;padding:calc(1px*var(--s,1)) calc(5px*var(--s,1));font:700 calc(13px*var(--s,1))/1.3 "Noto Sans TC",sans-serif;color:#14181d;border-radius:3px}
.lbl::before{display:none}
.lbl.off{color:#8a949c;font-weight:500}
.leaflet-tooltip.pick{font:13px/1.5 "Noto Sans TC",sans-serif;padding:5px 9px;white-space:nowrap}.pick span{margin-left:.6em;color:#5b6670}.pick .off{color:#8a949c}
.date-pick .leaflet-popup-content{font-size:14px;line-height:1.55;color:#14181d;overflow-wrap:anywhere}
.date-pick section+section{margin-top:8px;padding-top:8px;border-top:1px solid #dfe3e6}

.ll{font-family:"Noto Sans TC",sans-serif;font-weight:700;paint-order:stroke;stroke:#fff;stroke-linejoin:round;pointer-events:none;letter-spacing:.06em}
.leaflet-container{font-family:"Noto Sans TC",sans-serif}

.leaflet-container img.leaflet-tile{mix-blend-mode:normal;width:257px!important;height:257px!important}
@media(max-width:760px){html,body{height:auto}.app{grid-template-columns:minmax(0,1fr);grid-template-rows:62svh auto;height:auto}.side{border-left:0;border-top:1px solid var(--line);overflow:visible}}
</style>

</head>

 '獅子公園三角線東側（原主線弧線）':'沿用第一臨港線 1941 至 2008 年的年代。1989 年圖上此弧線與道路重疊，實際使用到哪一年未查明。',
 '糖鐵籬子內線後期段（沿中山四路接臺糖倉庫）':'本段起訖未查明。開辦取相接的臺鐵台糖中心倉庫線 1962 年開辦，終年取臺鐵台糖籬仔內轉運線 1993 年 12 月廢止。',
 '糖鐵鳳山線（鳳山—二苓—小港糖廠）':'文獻記 1909 年 10 月 5 日開業。1955 年圖仍有，1966 年圖上牛寮以南已被機場跑道切斷，圖上取 1966 年為停用上限，實際可能更早。',
 '糖鐵林園線（小港糖廠—佛公—鳳山）':sugarTransferDates,
 '糖鐵籬子內線（籬仔內站—佛公）':sugarTransferDates,
 '糖鐵三角線（佛公）':sugarTransferDates,
 '糖鐵林園線（鳳山—大寮）':'臺灣總督府府報第 2722 號記 1909 年 6 月 5 日運輸營業。1989 年圖仍有、1993 年圖已無，停用推定為 1991 年底。',
 '糖鐵淡水線（大寮岔點段）':danshuiDates,
 '糖鐵大寮三角線':danshuiDates
};
function xyYrs(name){
 const years=XY[name];
 if(!years)return '';
 const [start,end]=years;
 return '著色年份 '+(start??'')+'–'+(end==null?'':end-1);
}
function pickAt(pt,tol){const hits=[];
 const near=l=>{if(!m.hasLayer(l)||!l._parts||!l._pxBounds)return Infinity;const b=l._pxBounds;
  if(pt.x<b.min.x-tol||pt.x>b.max.x+tol||pt.y<b.min.y-tol||pt.y>b.max.y+tol)return Infinity;
  let d=Infinity;for(const part of l._parts)for(let i=1;i<part.length&&d>.5;i++)d=Math.min(d,L.LineUtil.pointToSegmentDistance(pt,part[i-1],part[i]));return d};
 for(const base of SEG){const d=near(lay[base.id]);if(d<=tol){
  const s=routeForYear(base,curY);
  hits.push({d,t:s.name,y:segYrs(s),off:curY>=s.c,basis:s.t})}}
 for(const l of exL){const d=near(l);if(d<=tol)hits.push({d,t:l._xn,y:xyYrs(l._xn),off:closed(l._xn)})}
 const seen=new Set();return hits.sort((a,b)=>(a.off-b.off)||(a.d-b.d)).filter(h=>!seen.has(h.t)&&seen.add(h.t))}
function showPick(e,tol){const h=pickAt(e.layerPoint,tol);m.getContainer().style.cursor=h.length?'pointer':'';
 if(!h.length){m.closeTooltip(tip);return}
 tip.setLatLng(e.latlng).setContent(h.slice(0,5).map(x=>`<div${x.off?' class="off"':''}>${x.t}${x.y?`<span>${x.y}</span>`:''}</div>`).join('')+'<small>點選查看年代依據</small>');
 if(!m.hasLayer(tip))m.openTooltip(tip)}
const datePopup=L.popup({className:'date-pick'});
function closePick(){m.closePopup(datePopup);m.closeTooltip(tip)}
m.on('mousemove',e=>{if(!e.originalEvent.buttons&&!m.hasLayer(datePopup))showPick(e,8)});
m.on('click',e=>{
 const hits=pickAt(e.layerPoint,L.Browser.touch?18:8);
 closePick();
 if(!hits.length)return;
 const size=m.getSize();
 datePopup.options.maxWidth=Math.min(340,Math.max(80,size.x-80));
 datePopup.options.maxHeight=Math.max(60,Math.floor(size.y*.52));
 const sections=hits.map(hit=>{
  const basis=(G.xb||{})[hit.t]||dateEvidence[hit.t]||hit.basis||'年代依據未收錄。';
  return `<section><b>${hit.t}</b><small>${hit.y}</small><p>${basis}</p></section>`;
 });
 datePopup.setLatLng(e.latlng).setContent(sections.join('')).openOn(m);
});
exBox.addEventListener('change',closePick);
m.on('mouseout movestart zoomstart',()=>{m.closeTooltip(tip);m.getContainer().style.cursor=''});

const _draw=draw;draw=function(y){curY=y;eraGeom(y);_draw(y);bpL.forEach(b=>{const s=SEG.find(x=>x.id===b._seg);s&&y>=s.o&&y<s.c?b.addTo(m):b.remove()});drawExtra();drawSidebar(y);relabel()};
m.on('zoomend moveend',relabel);
window.__railCheck = {segments: SEG, lines: lay, extras: exL, yards: yard, branches: bpL, stations: stl, pickAt, routeForYear};
// 使用網址片段，讓 GitHub Pages 和離線 HTML 都能分享同一個年份與視角。
let restoringView=false;
function restoreView(){
 const params=new URLSearchParams(location.hash.slice(1));
 const number=key=>{const value=params.get(key);return /^-?\d+(?:\.\d+)?$/.test(value)?Number(value):NaN};
 const year=number('year'),lat=number('lat'),lng=number('lng'),zoom=number('zoom');
 restoringView=true;
 exBox.checked=params.get('extra')!=='0';
 baseBox.checked=params.get('base')!=='0';
 drawBase();
 if(Number.isFinite(lat)&&Number.isFinite(lng)&&L.latLngBounds(G.bounds).contains([lat,lng])&&zoom>=m.getMinZoom()&&zoom<=m.getMaxZoom()){
  m.setView([lat,lng],zoom,{animate:false});
 }else{
  m.fitBounds(FB,{animate:false});
 }
 draw(Number.isInteger(year)&&year>=Number(sl.min)&&year<=Number(sl.max)?year:1977);
 restoringView=false;
}
function saveView(){
 if(restoringView)return;
 const center=m.getCenter();
 const params=new URLSearchParams({year:String(curY),lat:center.lat.toFixed(6),lng:center.lng.toFixed(6),zoom:m.getZoom().toFixed(1),extra:exBox.checked?'1':'0',base:baseBox.checked?'1':'0'});
 const hash='#'+params.toString();
 if(location.hash===hash)return;
 try{history.replaceState(history.state,'',hash)}catch(error){
  // 部分嵌入式網頁禁止修改瀏覽器歷程，地圖仍可操作。
  if(error.name!=='SecurityError')throw error;
 }
}
restoreView();
addEventListener('hashchange',restoreView);
m.on('moveend',saveView);
sl.addEventListener('change',saveView);
document.getElementById('tk').addEventListener('click',e=>{if(e.target.closest('button'))saveView()});
exBox.addEventListener('change',saveView);
baseBox.addEventListener('change',()=>{drawBase();saveView()});
addEventListener('load',()=>{m.invalidateSize();relabel()});
}
</script>
