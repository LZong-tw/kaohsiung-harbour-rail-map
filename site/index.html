<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>高雄臨港線 1900–2024</title>
<link rel="stylesheet" href="leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE 研究底圖：安靜、精確，線路是主角
   IDEA 鐵道略圖畫在今日街圖上；選一個年份，看哪些線在跑、哪些已停
   PICTURE 大地圖，線名沿線標註；旁邊是該年的路線清單，清單本身就是圖例
   COLOUR 灰階底圖；縱貫藍 #1d4e89、臨港線紫 #7b2d8e、第二臨港線朱 #c1121f、支線橙 #c2620a、輕軌綠 #2f9e44、停用灰虛線
   TYPE Noto Sans TC 900 年份、700 線名、400 說明
   LAYOUT 桌機：地圖左、清單右；手機：地圖在上、清單在下 */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0e1418);--ink:light-dark(#14181d,#e7ecef);--mute:light-dark(#5b6670,#9aa7b1);--soft:light-dark(#f3f4f2,#162027);--line:light-dark(#dfe3e6,#26323a);--acc:#7b2d8e}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Noto Sans TC",system-ui,sans-serif}
.app{display:grid;grid-template-columns:minmax(0,1fr) 360px;height:100%}
.mapbox{position:relative}
#map{position:absolute;inset:0;background:#d9dcd8}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .leaflet-tile-pane{filter:invert(.92) hue-rotate(180deg) brightness(.85)}}
:root[data-theme=dark] .leaflet-tile-pane{filter:invert(.92) hue-rotate(180deg) brightness(.85)}
.hd{position:absolute;z-index:500;top:12px;left:16px;pointer-events:none;color:#14181d;text-shadow:0 0 3px #fff,0 0 8px #fff,0 0 14px #fff}
.hd h1{margin:0;font-size:clamp(18px,2.4vw,24px);font-weight:700;line-height:1.2}
.hd output{display:block;font-size:clamp(48px,8vw,80px);font-weight:900;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.side{overflow:auto;border-left:1px solid var(--line);padding:16px 18px 24px}
.side input[type=range]{width:100%;height:40px;margin:0;accent-color:var(--acc)}
.ticks{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.ticks button{min-height:32px;padding:0 9px;border-radius:16px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:13px;font-variant-numeric:tabular-nums;cursor:pointer}
.ticks button:hover{border-color:var(--ink)}
.ticks button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ev{margin:0 0 16px;padding:10px 12px;border-left:4px solid var(--acc);background:var(--soft);border-radius:0 6px 6px 0}
.ev time{display:block;font-weight:700;font-variant-numeric:tabular-nums}
.side h2{font-size:15px;margin:14px 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.side h2 span{font-variant-numeric:tabular-nums;color:var(--mute);font-weight:500}
.ls{list-style:none;margin:0;padding:0}
.ls button{display:grid;grid-template-columns:34px minmax(0,1fr);gap:0 10px;padding:6px;width:100%;border:0;border-radius:6px;background:transparent;color:inherit;font:inherit;text-align:start;cursor:pointer}
.ls button:hover,.ls button:focus-visible{background:var(--soft)}
.ls .empty{padding:6px 6px 6px 50px}
.ls svg{margin-top:5px}
.ls b{font-weight:700}
.ls .y{color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap;margin-left:6px;font-size:13px}
.ls .description{grid-column:2;margin:1px 0 0;color:var(--mute);font-size:13px}
.ls.off b{font-weight:500;color:var(--mute)}
.key{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 14px;margin:12px 0 0;font-size:13px;color:var(--mute)}
.key div{display:flex;align-items:center;gap:8px;min-height:22px}.key svg{flex:none}
.tog{display:flex;align-items:center;gap:8px;font-size:14px;min-height:40px;cursor:pointer;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.tog input{width:18px;height:18px;margin:0;accent-color:var(--acc)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.lbl{background:rgba(255,255,255,.92);border:0;box-shadow:none;padding:calc(1px*var(--s,1)) calc(5px*var(--s,1));font:700 calc(13px*var(--s,1))/1.3 "Noto Sans TC",sans-serif;color:#14181d;border-radius:3px}
.lbl::before{display:none}
.lbl.off{color:#8a949c;font-weight:500}
.leaflet-tooltip.pick{font:13px/1.5 "Noto Sans TC",sans-serif;padding:5px 9px;white-space:nowrap}.pick span{margin-left:.6em;color:#5b6670}.pick .off{color:#8a949c}
.date-pick .leaflet-popup-content{font-size:14px;line-height:1.55;color:#14181d;overflow-wrap:anywhere}
.date-pick section+section{margin-top:8px;padding-top:8px;border-top:1px solid #dfe3e6}
.date-pick small{display:block;color:#52616b;font-size:13px}
.date-pick .leaflet-popup-content p{margin:3px 0 0}
.ll{font-family:"Noto Sans TC",sans-serif;font-weight:700;paint-order:stroke;stroke:#fff;stroke-linejoin:round;pointer-events:none;letter-spacing:.06em}
.leaflet-container{font-family:"Noto Sans TC",sans-serif}
/* 小數縮放層級時圖磚之間會露出一像素的縫：讓每張圖磚多蓋一像素，並取消 Leaflet 預設的 plus-lighter 疊色（否則重疊處會變亮） */
.leaflet-container img.leaflet-tile{mix-blend-mode:normal;width:257px!important;height:257px!important}
@media(max-width:760px){html,body{height:auto}.app{grid-template-columns:minmax(0,1fr);grid-template-rows:62svh auto;height:auto}.side{border-left:0;border-top:1px solid var(--line);overflow:visible}}
</style>

</head>

</aside>
</div>

for(const s of SEG)if(s.lb)mkLabel(s.id,G.seg[s.id],s.lb,STY[s.k].color,13);
const order=['zg_n','zgc','zg_s','fso','pt','west','hm','l1w','ob','w0','w1','qzb','w2','w3','k4','e1','zd','s2','s2b','c2','c3','lr1','lr2'];
const stl={};
for(const[n,o,c,dir]of STN){const p=G.st[n];stl[n]={o,c,mk:L.circleMarker(p,{radius:5,color:'#3b4248',weight:2,fillColor:'#fff',fillOpacity:1}),dir}}
const sl=document.getElementById('sl'),yr=document.getElementById('yr');
var draw=function(y){
 closePick();
 yr.textContent=y;sl.value=y;
 for(const id of order){const s=routeForYear(SEG.find(x=>x.id===id),y),l=lay[id];
  if(y<s.o){l.remove();showLabel(id,false);continue}
  if(y>=s.c){if(s.lr){l.remove();showLabel(id,false);continue}l.setStyle({...GH});l.addTo(m);l.bringToBack();showLabel(id,false);continue}
  if(LBL[id]){
   const label=LBL[id];
   if(label.text!==s.lb&&label.el)label.el.firstChild.textContent=s.lb;
   label.text=s.lb;label.color=STY[s.k].color;
  }
  l.setStyle({opacity:1,...STY[s.k],dashArray:STY[s.k].dashArray||null});l.addTo(m);if(s.lr)l.bringToFront();showLabel(id,true)}
 yard.forEach(g=>y>=g._o&&y<g._c?g.addTo(m):g.remove());
 ttL.forEach(g=>y>=g._o&&y<g._c?g.addTo(m):g.remove());
 for(const[n,v]of Object.entries(stl)){
  if(y<v.o||(n==='打狗停車場'&&y>=v.c)){v.mk.remove();continue}
  let on=y<v.c,stationName=n==='高雄港站'?harbourStationName(y):n;
  const per=STX[n];if(per){const r=per.find(r=>r[0]<=y&&y<r[1]);on=!!r;stationName=(r||per.filter(r=>r[0]<=y).pop()||per[0])[2]}
  v.mk.setStyle({color:on?'#3b4248':'#8a949c',fillColor:on?'#fff':'#c9ced2'});
  v.mk.unbindTooltip().bindTooltip(stationName,{permanent:true,direction:v.dir,className:'lbl'+(on?'':' off'),offset:v.dir==='right'?[6,0]:v.dir==='left'?[-6,0]:[0,0]}).addTo(m)}
 const last=[...EV].reverse().find(e=>e[0]<=y);
 document.getElementById('ev').innerHTML=last?`<time>${last[1]}</time>${last[2]}`:'臨港線尚未出現';
 document.querySelectorAll('#tk button').forEach(b=>b.classList.toggle('on',+b.dataset.y===y));
}
document.getElementById('tk').innerHTML=[1900,1907,1941,1955,1967,1977,1988,2008,2011,2018,2024].map(v=>`<button type="button" data-y="${v}">${v}</button>`).join('');
sl.addEventListener('input',()=>draw(+sl.value));
document.getElementById('tk').addEventListener('click',e=>{const b=e.target.closest('button');if(b)draw(+b.dataset.y)});
const EXC=n=>n.startsWith('糖鐵')?'#7a5c3a':null;   // 糖業鐵道一律棕色
const exL=[];
const extraRoutes=new Map();
const MAINX=new Set(['獅子公園三角線東側（原主線弧線）']);
for(const[n,parts]of Object.entries(G.extra)){const mx=MAINX.has(n),col=mx?'#7b2d8e':(EXC(n)||'#c2620a');
 const layers=[];
 for(const g of parts){const st=mx?{color:col,weight:4,lineCap:'round',opacity:.95,dashArray:null,interactive:false}:{color:col,weight:3,dashArray:'6 4',lineCap:'round',opacity:.95,interactive:false};const pl=L.polyline(g,st);pl._xn=n;pl._st=st;pl._xi=parts.indexOf(g);exL.push(pl);layers.push(pl)}
 extraRoutes.set('x-'+n,{name:n,layers,kind:mx?'main':EXC(n)?'sugar':'extra'});
 const longest=parts.reduce((a,b)=>b.length>a.length?b:a);mkLabel('x-'+n,longest,n,col,11,n==='糖鐵籬子內線'?.12:.3)}
const BRSEG={'5.4K':'zd','6.8K':'s2','前鎮橋':'qzb'};
const bpL=Object.entries(G.br).map(([n,p])=>{const c=L.circleMarker(p,{radius:3,color:'#5b6670',weight:2,fillColor:'#fff',fillOpacity:1}).bindTooltip(n,{direction:'bottom',offset:[0,4]});c._seg=Object.entries(BRSEG).find(([k])=>n.startsWith(k))?.[1];return c});
const exBox=document.getElementById('ex');
let curY=1977;const XY=G.xy||{};
const opened=n=>{const r=XY[n];return !r||r[0]==null||curY>=r[0]},closed=n=>{const r=XY[n];return !!r&&r[1]!=null&&curY>=r[1]};
const inY=n=>opened(n)&&!closed(n);
function drawExtra(){const on=exBox.checked;
 exL.forEach(l=>{const n=l._xn;
  if(MAINX.has(n)){if(!opened(n)){l.remove();return}l.setStyle(closed(n)?{...GH}:l._st);l.addTo(m);if(closed(n))l.bringToBack();return}
  on&&inY(n)?l.addTo(m):l.remove()});
 for(const n in G.extra)showLabel('x-'+n,(on||MAINX.has(n))&&inY(n))}
// 同一組已繪出的圖層決定線型、清單和計數；同名側線的多段幾何共用一列。
function drawSidebar(y){
 const active=[],closedRoutes=[];
 for(const segment of SEG){
  if(!m.hasLayer(lay[segment.id]))continue;
  const s=routeForYear(segment,y),off=y>=s.c;
  (off?closedRoutes:active).push({...s,kind:off?'closed':s.k,style:off?GH:STY[s.k],years:segYrs(s)});
 }
 for(const [id,{name,layers,kind}] of extraRoutes){
  if(!m.hasLayer(layers[0]))continue;
  const [o,c]=XY[name]||[],off=closed(name);
  (off?closedRoutes:active).push({id,name,o,c,kind:off?'closed':kind,style:off?GH:layers[0]._st,
   years:xyYrs(name),t:dateEvidence[name]||''});
 }
 active.sort((a,b)=>a.o-b.o);
 closedRoutes.sort((a,b)=>a.c-b.c||a.o-b.o);
 const visible=[...active,...closedRoutes];
 const labels={main:'臨港線',br:'臨港線支線',red:'第二臨港線',lr:'環狀輕軌',
  unc:'支線，年份未查證',extra:'專用側線',sugar:'糖業鐵道',closed:'已停用'};
 const kinds=new Map();
 for(const route of visible)if(!kinds.has(route.kind))kinds.set(route.kind,route.style);
 const keyOrder=['trunk','underground','main','br','red','lr','extra','sugar','unc','closed'];
 document.getElementById('key').innerHTML=keyOrder.filter(kind=>kinds.has(kind)).map(kind=>{
  const style=kinds.get(kind);
  const label=labels[kind]||[...new Set(visible.filter(r=>r.kind===kind).map(r=>r.lb||r.name))].join('、');
  return `<div data-kind="${kind}">${sw(style)}${label}</div>`;
 }).join('');
 for(const [list,count,rows] of [['la','na',active],['lc','nc',closedRoutes]]){
  document.getElementById(count).textContent=rows.length;
  document.getElementById(list).innerHTML=rows.map(r=>
   `<li data-id="${r.id}"><button type="button" data-id="${r.id}">${sw(r.style)}<span><b>${r.name}</b><span class="y">${r.years}</span></span><span class="description">${r.t}</span></button></li>`
  ).join('')||'<li class="empty">無</li>';
 }
}
for(const id of ['la','lc'])document.getElementById(id).addEventListener('click',e=>{
 const button=e.target.closest('button[data-id]');
 if(!button)return;
 const key=button.dataset.id,extra=extraRoutes.get(key);
 const bounds=extra?extra.layers.reduce((box,line)=>box.extend(line.getBounds()),L.latLngBounds([])):lay[key].getBounds();
 m.fitBounds(bounds,{padding:[40,40],maxZoom:16});
});
exBox.addEventListener('change',()=>{drawExtra();drawSidebar(curY);relabel()});
// 路線查詢：不靠各線自己的滑鼠事件（重疊的路廊只有最上層那條點得到、虛線的空隙點不到），
// 改成在游標附近找所有看得到的線，列在同一個提示框裡。
const tip=L.tooltip({direction:'top',offset:[0,-8],className:'pick'});
function segYrs(s){
 if(s.k==='underground')return '2018 年起地下化';
 if(s.id==='west')return '路段 '+s.o+' 年通車，'+s.c+' 年停用';
 if(s.k==='trunk')return '路段 '+s.o+' 年通車';
 return s.k==='unc'?'約 1977–2011':s.o+'–'+(s.c>3000?'':s.c);
}
// 研究依據見 METHODS.md〈側線與糖鐵的顯示年份〉及專用側線表。
// 年份滑桿的截止值表示第一個停止著色的年份，與文獻的停用日期分開呈現。
const shipyardDates='開辦取所接母線的通車年。僅見於 1945 年美軍圖，1955 年圖已無，實際停用年未查明。';
const arsenalDates='文獻記聯勤二〇五廠線於 1959 年 2 月開辦。廢止日未查明，圖上以凱旋四路段 2018 年停用為上限。';
const sugarTransferDates='這段糖鐵的起訖未查明。地圖借用臺鐵台糖籬仔內轉運線的文獻年代：1955 年 3 月 1 日至 1993 年 12 月 28 日。';
const danshuiDates='1966 年圖無、1977 年臺糖圖有，開辦推定為 1971 年。停用推定與林園線鳳山—大寮段同在 1991 年底。';
const dateEvidence={
 '台電南部火力發電所線（推定）':'文獻記 1955 年 10 月 1 日開辦，1992 年 8 月 7 日廢止。線路與廠主的對應為推定。',
 '台灣肥料公司線（臺肥三廠）':'文獻記 1952 年 1 月 1 日開辦。廢止日未查明，圖上以第一臨港線西段 2008 年停用為上限。',
 '台灣鹼業公司線（推定）':'文獻記 1954 年 3 月 21 日開辦，1993 年 12 月 28 日廢止。線路與廠主的對應為推定。',
 '台灣塑膠公司線（推定）':'文獻記 1965 年 10 月 18 日開辦，1990 年 11 月 30 日廢止。線路與廠主的對應為推定。',
 '205 兵工廠外側線（推定兼硫酸錏廠線）':arsenalDates,
 '205 兵工廠大門側線（凱旋四路側）':arsenalDates,
 '台糖中心倉庫線（推定）':'文獻記 1962 年 12 月 1 日開辦。廢止日未查明，圖上以第二臨港線 2011 年廢止為上限。',
 '中岸壁線':'1945、1955、1966、1989、2001 年圖皆有。開辦年未查明，自最早圖證起顯示；停用取第一臨港線西段 2008 年停用。',
 '裏岸壁線':'1945、1955、1989 年圖可見。開辦年未查明，自最早圖證起顯示；停用取第一臨港線西段 2008 年停用。',
 '淺野線（臺泥側線）':'1945 至 2001 年的圖上可見。起訖未查明，自最早圖證起顯示，以 2018 年縱貫線地下化為上限。',
 '濱線（商港側，往海關碼頭）':'開辦推定約 1908 年，與漁港側同期。1962 年圖仍有股道，1970 年圖僅存地界線，停用推定約 1965 年。',
 '苓雅寮東側線（1945 年美軍圖，三股）':shipyardDates,
 '船渠北岸造船所線 A（1945 年美軍圖）':shipyardDates,
 '船渠北岸造船所線 B（1945 年美軍圖）':shipyardDates,
 '經貿變電所側線（推定台機鋼品廠線）':'1955 年圖已有，2009 年街景仍見路面下的軌道。開辦及廢止日未查明，顯示上限取第一臨港線西段 2008 年停用。',
 '獅子公園三角線東側（原主線弧線）':'沿用第一臨港線 1941 至 2008 年的年代。1989 年圖上此弧線與道路重疊，實際使用到哪一年未查明。',
 '糖鐵籬子內線後期段（沿中山四路接臺糖倉庫）':'本段起訖未查明。開辦取相接的臺鐵台糖中心倉庫線 1962 年開辦，終年取臺鐵台糖籬仔內轉運線 1993 年 12 月廢止。',
 '糖鐵鳳山線（鳳山—二苓—小港糖廠）':'文獻記 1909 年 10 月 5 日開業。1955 年圖仍有，1966 年圖上牛寮以南已被機場跑道切斷，圖上取 1966 年為停用上限，實際可能更早。',
 '糖鐵林園線（小港糖廠—佛公—鳳山）':sugarTransferDates,
 '糖鐵籬子內線（籬仔內站—佛公）':sugarTransferDates,
 '糖鐵三角線（佛公）':sugarTransferDates,
 '糖鐵林園線（鳳山—大寮）':'臺灣總督府府報第 2722 號記 1909 年 6 月 5 日運輸營業。1989 年圖仍有、1993 年圖已無，停用推定為 1991 年底。',
 '糖鐵淡水線（大寮岔點段）':danshuiDates,
 '糖鐵大寮三角線':danshuiDates
};
function xyYrs(name){
 const years=XY[name];
 if(!years)return '';
 const [start,end]=years;
 return '著色年份 '+(start??'')+'–'+(end==null?'':end-1);
}
function pickAt(pt,tol){const hits=[];
 const near=l=>{if(!m.hasLayer(l)||!l._parts||!l._pxBounds)return Infinity;const b=l._pxBounds;
  if(pt.x<b.min.x-tol||pt.x>b.max.x+tol||pt.y<b.min.y-tol||pt.y>b.max.y+tol)return Infinity;
  let d=Infinity;for(const part of l._parts)for(let i=1;i<part.length&&d>.5;i++)d=Math.min(d,L.LineUtil.pointToSegmentDistance(pt,part[i-1],part[i]));return d};
 for(const base of SEG){const d=near(lay[base.id]);if(d<=tol){
  const s=routeForYear(base,curY);
  hits.push({d,t:s.name,y:segYrs(s),off:curY>=s.c,basis:s.t})}}
 for(const l of exL){const d=near(l);if(d<=tol)hits.push({d,t:l._xn,y:xyYrs(l._xn),off:closed(l._xn)})}
 const seen=new Set();return hits.sort((a,b)=>(a.off-b.off)||(a.d-b.d)).filter(h=>!seen.has(h.t)&&seen.add(h.t))}
function showPick(e,tol){const h=pickAt(e.layerPoint,tol);m.getContainer().style.cursor=h.length?'pointer':'';
 if(!h.length){m.closeTooltip(tip);return}
 tip.setLatLng(e.latlng).setContent(h.slice(0,5).map(x=>`<div${x.off?' class="off"':''}>${x.t}${x.y?`<span>${x.y}</span>`:''}</div>`).join('')+'<small>點選查看年代依據</small>');
 if(!m.hasLayer(tip))m.openTooltip(tip)}
const datePopup=L.popup({className:'date-pick'});
function closePick(){m.closePopup(datePopup);m.closeTooltip(tip)}
m.on('mousemove',e=>{if(!e.originalEvent.buttons&&!m.hasLayer(datePopup))showPick(e,8)});
m.on('click',e=>{
 const hits=pickAt(e.layerPoint,L.Browser.touch?18:8);
 closePick();
 if(!hits.length)return;
 const size=m.getSize();
 datePopup.options.maxWidth=Math.min(340,Math.max(80,size.x-80));
 datePopup.options.maxHeight=Math.max(60,Math.floor(size.y*.52));
 const sections=hits.map(hit=>{
  const basis=(G.xb||{})[hit.t]||dateEvidence[hit.t]||hit.basis||'年代依據未收錄。';
  return `<section><b>${hit.t}</b><small>${hit.y}</small><p>${basis}</p></section>`;
 });
 datePopup.setLatLng(e.latlng).setContent(sections.join('')).openOn(m);
});
exBox.addEventListener('change',closePick);
m.on('mouseout movestart zoomstart',()=>{m.closeTooltip(tip);m.getContainer().style.cursor=''});

const _draw=draw;draw=function(y){curY=y;eraGeom(y);_draw(y);bpL.forEach(b=>{const s=SEG.find(x=>x.id===b._seg);s&&y>=s.o&&y<s.c?b.addTo(m):b.remove()});drawExtra();drawSidebar(y);relabel()};
m.on('zoomend moveend',relabel);
window.__railCheck = {segments: SEG, lines: lay, extras: exL, yards: yard, branches: bpL, stations: stl, pickAt, routeForYear};
// 使用網址片段，讓 GitHub Pages 和離線 HTML 都能分享同一個年份與視角。
let restoringView=false;
function restoreView(){
 const params=new URLSearchParams(location.hash.slice(1));
 const number=key=>{const value=params.get(key);return /^-?\d+(?:\.\d+)?$/.test(value)?Number(value):NaN};
 const year=number('year'),lat=number('lat'),lng=number('lng'),zoom=number('zoom');
 restoringView=true;
 exBox.checked=params.get('extra')!=='0';
 baseBox.checked=params.get('base')!=='0';
 drawBase();
 if(Number.isFinite(lat)&&Number.isFinite(lng)&&L.latLngBounds(G.bounds).contains([lat,lng])&&zoom>=m.getMinZoom()&&zoom<=m.getMaxZoom()){
  m.setView([lat,lng],zoom,{animate:false});
 }else{
  m.fitBounds(FB,{animate:false});
 }
 draw(Number.isInteger(year)&&year>=Number(sl.min)&&year<=Number(sl.max)?year:1977);
 restoringView=false;
}
function saveView(){
 if(restoringView)return;
 const center=m.getCenter();
 const params=new URLSearchParams({year:String(curY),lat:center.lat.toFixed(6),lng:center.lng.toFixed(6),zoom:m.getZoom().toFixed(1),extra:exBox.checked?'1':'0',base:baseBox.checked?'1':'0'});
 const hash='#'+params.toString();
 if(location.hash===hash)return;
 try{history.replaceState(history.state,'',hash)}catch(error){
  // 部分嵌入式網頁禁止修改瀏覽器歷程，地圖仍可操作。
  if(error.name!=='SecurityError')throw error;
 }
}
restoreView();
addEventListener('hashchange',restoreView);
m.on('moveend',saveView);
sl.addEventListener('change',saveView);
document.getElementById('tk').addEventListener('click',e=>{if(e.target.closest('button'))saveView()});
exBox.addEventListener('change',saveView);
baseBox.addEventListener('change',()=>{drawBase();saveView()});
addEventListener('load',()=>{m.invalidateSize();relabel()});
}
